name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar site estatico
        run: |
          mkdir -p _site
          cp quiz.html revisao.html _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Materiais de estudo</title>
          <style>
            :root{color-scheme:dark}
            *{box-sizing:border-box}
            body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
              background:#0e1013;color:#e7e9ec;
              font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
              line-height:1.6;padding:40px 20px}
            main{width:100%;max-width:460px}
            h1{font-size:1.3rem;margin:0 0 6px}
            p.sub{color:#9aa1ac;margin:0 0 26px;font-size:.95rem}
            a.card{display:block;text-decoration:none;color:inherit;
              background:#181b21;border:1px solid #2a2f39;border-radius:12px;
              padding:18px 20px;margin:12px 0;transition:border-color .12s}
            a.card:hover{border-color:#6ba7ff}
            a.card b{display:block;font-size:1.05rem;margin-bottom:2px}
            a.card span{color:#9aa1ac;font-size:.88rem}
          </style>
          </head>
          <body>
          <main>
            <h1>Caderno Unificado &mdash; materiais de estudo</h1>
            <p class="sub">Atendimento / Briefing + Marketing Internacional</p>
            <a class="card" href="./revisao.html"><b>Revisao completa</b><span>Resumo por tema + quiz de 15 questoes</span></a>
            <a class="card" href="./quiz.html"><b>Quiz rapido</b><span>5 questoes, uma por vez, com placar final</span></a>
          </main>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
